apiVersion: v1
kind: ConfigMap
metadata:
  name: attendance-config
data:
  NODE_ENV: production
  PORT: "3000"
  DB_PATH: /data/attendance.sqlite
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attendance-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: attendance
  template:
    metadata:
      labels:
        app: attendance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: attendance
          image: attendance:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: attendance-config
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: attendance-data
---
apiVersion: v1
kind: Service
metadata:
  name: attendance
spec:
  selector:
    app: attendance
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
